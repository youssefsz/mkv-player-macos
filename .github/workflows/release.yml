name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  # Serialize every tag so two releases cannot generate divergent appcasts or
  # race the single gh-pages branch.
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, notarize, and publish
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure temporary build paths
        shell: bash
        run: printf 'MEDIA_CORE_CACHE_DIR=%s/MediaCore-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Validate tag and repository inputs
        shell: bash
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Release tag must have the form vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          for component in "$major" "$minor" "$patch"; do
            if [[ "$component" != "0" && "$component" == 0* ]]; then
              echo "Release tag components must not contain leading zeroes" >&2
              exit 1
            fi
          done
          if (( minor > 999 || patch > 999 )); then
            echo "Minor and patch versions must be below 1000" >&2
            exit 1
          fi
          version="${tag#v}"
          build_number=$((major * 1000000 + minor * 1000 + patch))
          if (( build_number < 1 )); then
            echo "Release version must produce a positive build number" >&2
            exit 1
          fi
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'BUILD_NUMBER=%s\n' "$build_number" >> "$GITHUB_ENV"

          if [[ -z "$SPARKLE_PUBLIC_ED_KEY" ]]; then
            echo 'SPARKLE_PUBLIC_ED_KEY is not configured' >&2
            exit 1
          fi

          bash -n scripts/*.sh
          source scripts/_media-core-common.sh
          validate_lock_file

      - name: Validate signing credentials
        shell: bash
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          TEMP_KEYCHAIN_PASSWORD: ${{ secrets.TEMP_KEYCHAIN_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          SPARKLE_ED_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_ED_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for name in \
            DEVELOPER_ID_P12_BASE64 \
            DEVELOPER_ID_P12_PASSWORD \
            TEMP_KEYCHAIN_PASSWORD \
            APPLE_API_KEY_P8_BASE64 \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER_ID \
            APPLE_DEVELOPMENT_TEAM \
            SPARKLE_ED_PRIVATE_KEY_BASE64; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required release credential is not configured: $name" >&2
              exit 1
            fi
          done

      - name: Verify committed playback fixtures
        working-directory: Tests/Fixtures/Generated
        run: shasum -a 256 --check SHA256SUMS.txt

      - name: Install source-build tools
        run: brew install meson nasm ninja pkg-config

      - name: Cache verified dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/MediaCore-cache
          key: release-media-core-sources-${{ hashFiles('scripts/media-core.lock') }}

      - name: Prepare universal MediaCore
        shell: bash
        run: |
          set -euo pipefail
          source scripts/_media-core-common.sh
          if [[ -n "$MEDIA_CORE_BINARY_URL" ]]; then
            # A previously published maintainer build is accepted only when
            # both its immutable URL and SHA-256 are committed in the lockfile.
            # Source pins are still fetched for the corresponding-source asset.
            scripts/verify-media-core-pins.sh
            scripts/bootstrap-media-core.sh
          else
            # Bootstrap the first release, or any dependency/toolchain change,
            # directly from the reviewed and checksum-verified source pins.
            scripts/build-media-core.sh
          fi

      - name: Regenerate project with MediaCore embedding
        shell: bash
        run: |
          set -euo pipefail
          gem install xcodeproj --version 1.27.0 --no-document
          ruby tools/generate_project.rb
          grep -q 'MediaCore.xcframework' MKVPlayer.xcodeproj/project.pbxproj

      - name: Resolve exact package dependencies
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project MKVPlayer.xcodeproj \
            -scheme MKVPlayer \
            -resolvePackageDependencies
          git diff --exit-code -- \
            MKVPlayer.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Run tests
        run: |
          set -euo pipefail
          swift test --package-path Packages/PlayerCore -Xswiftc -warnings-as-errors
          swift test --package-path Packages/MPVKit -Xswiftc -warnings-as-errors
          # Hosted runners do not guarantee an on-screen OpenGL drawable.
          # Keep real media decoding under test through libmpv's supported
          # software render API; developer Macs still test CAOpenGLLayer.
          xcodebuild \
            -project MKVPlayer.xcodeproj \
            -scheme MKVPlayer \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/MKVPlayer-Test-DerivedData" \
            -disableAutomaticPackageResolution \
            MKVPLAYER_TEST_COMPILATION_CONDITION='MKVPLAYER_REQUIRE_MEDIA_CORE_TESTS MKVPLAYER_HEADLESS_MEDIA_TESTS' \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Import Developer ID identity
        shell: bash
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          TEMP_KEYCHAIN_PASSWORD: ${{ secrets.TEMP_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/mkv-player-signing.keychain-db"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$certificate"
          chmod 600 "$certificate"
          security create-keychain -p "$TEMP_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$TEMP_KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$TEMP_KEYCHAIN_PASSWORD" \
            "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"

          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ {print $2; exit}')"
          if [[ -z "$identity" ]]; then
            echo 'No Developer ID Application identity was imported' >&2
            exit 1
          fi
          printf 'SIGNING_KEYCHAIN=%s\n' "$keychain" >> "$GITHUB_ENV"
          printf 'SIGNING_IDENTITY=%s\n' "$identity" >> "$GITHUB_ENV"

      - name: Archive the signed universal app
        shell: bash
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/MKVPlayer.xcarchive"
          derived_data="$RUNNER_TEMP/MKVPlayer-Release-DerivedData"
          xcodebuild archive \
            -project MKVPlayer.xcodeproj \
            -scheme MKVPlayer \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$archive" \
            -derivedDataPath "$derived_data" \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$APPLE_DEVELOPMENT_TEAM" \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS='--timestamp' \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            SPARKLE_PUBLIC_ED_KEY="$SPARKLE_PUBLIC_ED_KEY" \
            -disableAutomaticPackageResolution

          app="$archive/Products/Applications/MKV Player.app"
          test -d "$app"
          actual_version="$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")"
          test "$actual_version" = "$VERSION"
          embedded_sparkle_key="$(plutil -extract SUPublicEDKey raw -o - "$app/Contents/Info.plist")"
          test "$embedded_sparkle_key" = "$SPARKLE_PUBLIC_ED_KEY"
          codesign --verify --deep --strict --verbose=2 "$app"
          printf 'ARCHIVED_APP=%s\n' "$app" >> "$GITHUB_ENV"
          printf 'RELEASE_DERIVED_DATA=%s\n' "$derived_data" >> "$GITHUB_ENV"

      - name: Re-sign nested frameworks inside-out
        shell: bash
        run: |
          set -euo pipefail
          resolved_entitlements="$RUNNER_TEMP/MKVPlayer-resolved.entitlements"
          sparkle="$ARCHIVED_APP/Contents/Frameworks/Sparkle.framework"
          sparkle_version="$sparkle/Versions/B"
          media_core="$ARCHIVED_APP/Contents/Frameworks/MediaCore.framework"

          test -d "$sparkle_version"
          test -d "$media_core"
          codesign --display --entitlements :- "$ARCHIVED_APP" \
            > "$resolved_entitlements" \
            2>/dev/null
          plutil -lint "$resolved_entitlements"

          codesign --force --sign "$SIGNING_IDENTITY" \
            --options runtime --timestamp \
            "$sparkle_version/XPCServices/Installer.xpc"

          downloader="$sparkle_version/XPCServices/Downloader.xpc"
          if [[ -d "$downloader" ]]; then
            codesign --force --sign "$SIGNING_IDENTITY" \
              --options runtime --timestamp \
              --preserve-metadata=entitlements \
              "$downloader"
          fi

          codesign --force --sign "$SIGNING_IDENTITY" \
            --options runtime --timestamp \
            "$sparkle_version/Autoupdate"
          codesign --force --sign "$SIGNING_IDENTITY" \
            --options runtime --timestamp \
            "$sparkle_version/Updater.app"
          codesign --force --sign "$SIGNING_IDENTITY" \
            --options runtime --timestamp \
            "$sparkle"
          codesign --force --sign "$SIGNING_IDENTITY" \
            --options runtime --timestamp \
            "$media_core"
          codesign --force --sign "$SIGNING_IDENTITY" \
            --options runtime --timestamp \
            --entitlements "$resolved_entitlements" \
            "$ARCHIVED_APP"

          codesign --verify --deep --strict --verbose=2 "$ARCHIVED_APP"

      - name: Notarize and package
        shell: bash
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          source scripts/_media-core-common.sh
          release_directory="$RUNNER_TEMP/release"
          staging_directory="$RUNNER_TEMP/dmg-staging"
          api_key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          mkdir -p "$release_directory" "$staging_directory"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$api_key"
          chmod 600 "$api_key"

          pre_notary_zip="$RUNNER_TEMP/MKV-Player-${VERSION}-notary.zip"
          ditto -c -k --sequesterRsrc --keepParent "$ARCHIVED_APP" "$pre_notary_zip"
          xcrun notarytool submit "$pre_notary_zip" \
            --key "$api_key" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$ARCHIVED_APP"
          xcrun stapler validate "$ARCHIVED_APP"

          zip="$release_directory/MKV-Player-${VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$ARCHIVED_APP" "$zip"

          ditto "$ARCHIVED_APP" "$staging_directory/MKV Player.app"
          ln -s /Applications "$staging_directory/Applications"
          dmg="$release_directory/MKV-Player-${VERSION}.dmg"
          hdiutil create \
            -volname 'MKV Player' \
            -srcfolder "$staging_directory" \
            -format UDZO \
            -ov \
            "$dmg"
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" \
            --key "$api_key" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$dmg"

          scripts/verify-release.sh \
            --artifact "$zip" \
            --expected-version "$VERSION" \
            --expected-build "$BUILD_NUMBER" \
            --expected-sparkle-public-key "$SPARKLE_PUBLIC_ED_KEY" \
            --require-notarization
          scripts/verify-release.sh \
            --artifact "$dmg" \
            --expected-version "$VERSION" \
            --expected-build "$BUILD_NUMBER" \
            --expected-sparkle-public-key "$SPARKLE_PUBLIC_ED_KEY" \
            --require-notarization

          media_archive="$release_directory/MediaCore-${MPV_VERSION}.xcframework.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            Vendor/MediaCore.xcframework \
            "$media_archive"
          printf 'RELEASE_DIRECTORY=%s\n' "$release_directory" >> "$GITHUB_ENV"
          printf 'RELEASE_ZIP=%s\n' "$zip" >> "$GITHUB_ENV"

      - name: Bundle corresponding media source
        shell: bash
        run: |
          set -euo pipefail
          source scripts/_media-core-common.sh
          source_directory="$RUNNER_TEMP/corresponding-source"
          mkdir -p "$source_directory/sources"
          ditto "$MEDIA_CORE_CACHE_DIR/downloads" "$source_directory/sources/downloads"
          rsync -a --exclude='.git' \
            "$MEDIA_CORE_CACHE_DIR/libplacebo-$LIBPLACEBO_COMMIT/" \
            "$source_directory/sources/libplacebo-$LIBPLACEBO_VERSION/"
          ditto scripts "$source_directory/scripts"
          ditto THIRD_PARTY_NOTICES.md "$source_directory/THIRD_PARTY_NOTICES.md"
          ditto LICENSE "$source_directory/LICENSE"
          tar -cJf "$RELEASE_DIRECTORY/MediaCore-${MPV_VERSION}-Corresponding-Source.tar.xz" \
            -C "$source_directory" .

      - name: Sign the Sparkle enclosure and generate appcast
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_ED_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_ED_PRIVATE_KEY_BASE64 }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          source scripts/_media-core-common.sh
          sparkle_archive="$RUNNER_TEMP/Sparkle-${SPARKLE_TOOLS_VERSION}.tar.xz"
          sparkle_tools="$RUNNER_TEMP/Sparkle-tools"
          sparkle_key="$RUNNER_TEMP/sparkle-ed25519-private-key"
          appcast_input="$RUNNER_TEMP/appcast-input"

          # A prior run may have published the immutable release and then lost
          # the race to update Pages. Recover from the release asset instead of
          # regenerating metadata for newly timestamped local artifacts.
          existing_release_state="$(gh release view "$GITHUB_REF_NAME" \
            --json isDraft \
            --jq '.isDraft' \
            2>/dev/null || true)"
          if [[ "$existing_release_state" == "false" ]]; then
            existing_directory="$RUNNER_TEMP/existing-appcast"
            mkdir -p "$existing_directory"
            gh release download "$GITHUB_REF_NAME" \
              --pattern appcast.xml \
              --dir "$existing_directory"
            test -s "$existing_directory/appcast.xml"
            ditto "$existing_directory/appcast.xml" "$RELEASE_DIRECTORY/appcast.xml"
            exit 0
          fi

          download_verified "$SPARKLE_TOOLS_URL" "$SPARKLE_TOOLS_SHA256" "$sparkle_archive"
          mkdir -p "$sparkle_tools" "$appcast_input"
          tar -xJf "$sparkle_archive" -C "$sparkle_tools"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY_BASE64" | base64 --decode > "$sparkle_key"
          chmod 600 "$sparkle_key"

          sparkle_account="mkv-player-release-${GITHUB_RUN_ID}"
          "$sparkle_tools/bin/generate_keys" \
            --account "$sparkle_account" \
            -f "$sparkle_key" \
            >/dev/null
          derived_public_key="$("$sparkle_tools/bin/generate_keys" \
            --account "$sparkle_account" \
            -p)"
          if [[ "$derived_public_key" != "$SPARKLE_PUBLIC_ED_KEY" ]]; then
            echo "Sparkle private key does not match SPARKLE_PUBLIC_ED_KEY" >&2
            exit 1
          fi

          "$sparkle_tools/bin/sign_update" \
            --ed-key-file "$sparkle_key" \
            "$RELEASE_ZIP" \
            > "$RELEASE_DIRECTORY/Sparkle-signature.txt"

          ditto "$RELEASE_ZIP" "$appcast_input/$(basename "$RELEASE_ZIP")"
          latest_release_tag="$(gh release list \
            --exclude-drafts \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName // ""')"
          if [[ -n "$latest_release_tag" ]]; then
            previous_appcast="$RUNNER_TEMP/previous-appcast"
            mkdir -p "$previous_appcast"
            gh release download "$latest_release_tag" \
              --pattern appcast.xml \
              --dir "$previous_appcast"
            test -s "$previous_appcast/appcast.xml"
            ditto "$previous_appcast/appcast.xml" "$appcast_input/appcast.xml"
          elif git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --force origin gh-pages:refs/remotes/origin/gh-pages
            if git cat-file -e origin/gh-pages:appcast.xml 2>/dev/null; then
              git show origin/gh-pages:appcast.xml > "$appcast_input/appcast.xml"
            fi
          fi
          # The private/public pair was checked above and the archived app's
          # embedded public key was checked before notarization.
          "$sparkle_tools/bin/generate_appcast" \
            --ed-key-file "$sparkle_key" \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            --link "https://github.com/${GITHUB_REPOSITORY}" \
            "$appcast_input"
          enclosure_signature="$(xmllint \
            --xpath "string(//*[local-name()='enclosure' and contains(@url, '/$(basename "$RELEASE_ZIP")')]/@*[local-name()='edSignature'])" \
            "$appcast_input/appcast.xml")"
          if [[ -z "$enclosure_signature" ]]; then
            echo "Generated appcast does not contain an EdDSA signature for this release" >&2
            exit 1
          fi
          enclosure_xpath="//*[local-name()='enclosure' and contains(@url, '/$(basename "$RELEASE_ZIP")')]"
          item_xpath="$enclosure_xpath/parent::*[local-name()='item']"
          enclosure_url="$(xmllint --xpath "string($enclosure_xpath/@url)" "$appcast_input/appcast.xml")"
          item_version="$(xmllint --xpath "string($item_xpath/*[local-name()='version'])" "$appcast_input/appcast.xml")"
          enclosure_length="$(xmllint --xpath "string($enclosure_xpath/@length)" "$appcast_input/appcast.xml")"
          expected_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$RELEASE_ZIP")"
          expected_length="$(stat -f '%z' "$RELEASE_ZIP")"
          if [[ "$enclosure_url" != "$expected_url" ]]; then
            echo "Generated appcast enclosure URL does not match the release asset URL" >&2
            exit 1
          fi
          if [[ "$item_version" != "$BUILD_NUMBER" ]]; then
            echo "Generated appcast item version does not match build $BUILD_NUMBER" >&2
            exit 1
          fi
          if [[ "$enclosure_length" != "$expected_length" ]]; then
            echo "Generated appcast enclosure length does not match the release archive" >&2
            exit 1
          fi
          insecure_enclosures="$(xmllint \
            --xpath "count(//*[local-name()='enclosure' and not(starts-with(@url, 'https://'))])" \
            "$appcast_input/appcast.xml")"
          if [[ "$insecure_enclosures" != "0" ]]; then
            echo "Generated appcast contains a non-HTTPS enclosure URL" >&2
            exit 1
          fi
          "$sparkle_tools/bin/sign_update" \
            --verify \
            --ed-key-file "$sparkle_key" \
            "$RELEASE_ZIP" \
            "$enclosure_signature"
          ditto "$appcast_input/appcast.xml" "$RELEASE_DIRECTORY/appcast.xml"

      - name: Write release checksums
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/media-core.lock "$RELEASE_DIRECTORY/media-core.lock"
          cp THIRD_PARTY_NOTICES.md "$RELEASE_DIRECTORY/THIRD_PARTY_NOTICES.md"
          cp LICENSE "$RELEASE_DIRECTORY/LICENSE.txt"
          {
            sw_vers
            xcodebuild -version
            swift --version
            clang --version
            meson --version
            nasm --version
            ninja --version
            pkg-config --version
            ruby --version
            gem list '^xcodeproj$' --local
          } > "$RELEASE_DIRECTORY/BUILD-TOOLCHAIN.txt"
          (
            cd "$RELEASE_DIRECTORY"
            rm -f SHA256SUMS.txt
            release_files=(*)
            shasum -a 256 "${release_files[@]}" > SHA256SUMS.txt
          )

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing_release_state="$(gh release view "$GITHUB_REF_NAME" \
            --json isDraft \
            --jq '.isDraft' \
            2>/dev/null || true)"
          if [[ "$existing_release_state" == "false" ]]; then
            existing_directory="$RUNNER_TEMP/existing-release"
            mkdir -p "$existing_directory"
            gh release download "$GITHUB_REF_NAME" \
              --pattern appcast.xml \
              --dir "$existing_directory"
            test -s "$existing_directory/appcast.xml"
            ditto "$existing_directory/appcast.xml" "$RELEASE_DIRECTORY/appcast.xml"
            echo "Release already exists; using its immutable appcast asset for Pages recovery"
          else
            if [[ "$existing_release_state" == "true" ]]; then
              echo "Removing an incomplete draft release before retrying"
              gh release delete "$GITHUB_REF_NAME" --yes
            fi

            release_files=("$RELEASE_DIRECTORY"/*)
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --title "MKV Player $VERSION" \
              --generate-notes
            gh release upload "$GITHUB_REF_NAME" "${release_files[@]}"

            release_json="$(gh release view "$GITHUB_REF_NAME" \
              --json isDraft,assets)"
            if [[ "$(jq -r '.isDraft' <<<"$release_json")" != "true" ]]; then
              echo "Release must remain a draft while assets are verified" >&2
              exit 1
            fi
            if (( $(jq '.assets | length' <<<"$release_json") != ${#release_files[@]} )); then
              echo "Draft release asset count does not match the local release set" >&2
              exit 1
            fi
            for path in "${release_files[@]}"; do
              name="$(basename "$path")"
              local_digest="sha256:$(shasum -a 256 "$path" | awk '{print $1}')"
              remote_digest="$(jq -r \
                --arg name "$name" \
                '.assets[] | select(.name == $name) | .digest' \
                <<<"$release_json")"
              if [[ "$remote_digest" != "$local_digest" ]]; then
                echo "Uploaded release asset digest mismatch: $name" >&2
                exit 1
              fi
            done

            # Publishing locks the tag and all verified assets when repository
            # release immutability is enabled.
            gh release edit "$GITHUB_REF_NAME" --draft=false
          fi

          immutable="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            --jq '.immutable')"
          if [[ "$immutable" != "true" ]]; then
            echo 'Published release is mutable; enable immutable releases before continuing' >&2
            exit 1
          fi

      - name: Publish signed appcast to GitHub Pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pages_directory="$RUNNER_TEMP/gh-pages"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add -B gh-pages "$pages_directory" origin/gh-pages
          else
            git worktree add --detach "$pages_directory"
            git -C "$pages_directory" switch --orphan gh-pages
            git -C "$pages_directory" rm -rf --ignore-unmatch .
          fi

          appcast_needs_update=true
          current_appcast="$pages_directory/appcast.xml"
          if [[ -f "$current_appcast" ]]; then
            if grep -Fq "/releases/download/${GITHUB_REF_NAME}/" "$current_appcast"; then
              echo "Pages already contains $GITHUB_REF_NAME; no appcast update is needed"
              appcast_needs_update=false
            else
              latest_build="$(xmllint \
                --xpath "string((//*[local-name()='item']/*[local-name()='version'])[1])" \
                "$current_appcast")"
              if [[ ! "$latest_build" =~ ^[0-9]+$ ]]; then
                echo "Current appcast has no valid latest Sparkle build number" >&2
                exit 1
              fi
              if (( latest_build > BUILD_NUMBER )); then
                echo "Pages contains a newer release; refusing to restore stale site files"
                exit 0
              fi
            fi
          fi
          if [[ "$appcast_needs_update" == "true" ]]; then
            ditto "$RELEASE_DIRECTORY/appcast.xml" "$pages_directory/appcast.xml"
          fi

          release_json="$(gh release view "$GITHUB_REF_NAME" --json url,assets)"
          release_url="$(jq -r '.url' <<<"$release_json")"
          dmg_url="$(jq -r \
            '[.assets[] | select(.name | endswith(".dmg"))] | if length == 1 then .[0].url else "" end' \
            <<<"$release_json")"
          if [[ -z "$dmg_url" ]]; then
            echo "Published release must contain exactly one DMG asset" >&2
            exit 1
          fi
          scripts/render-site.sh \
            "$VERSION" \
            "$dmg_url" \
            "$release_url" \
            "$pages_directory"
          git -C "$pages_directory" config user.name 'github-actions[bot]'
          git -C "$pages_directory" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$pages_directory" add \
            appcast.xml \
            index.html \
            styles.css \
            app-screenshot.png \
            icon.png \
            .nojekyll
          if ! git -C "$pages_directory" diff --cached --quiet; then
            git -C "$pages_directory" commit -m "Update release site for $GITHUB_REF_NAME"
            auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
            git -C "$pages_directory" \
              -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth_header" \
              push origin gh-pages
          fi

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN"
          fi
          rm -f \
            "$RUNNER_TEMP/developer-id.p12" \
            "$RUNNER_TEMP/AuthKey_"*.p8 \
            "$RUNNER_TEMP/sparkle-ed25519-private-key"
          git worktree remove --force "$RUNNER_TEMP/gh-pages" 2>/dev/null || true
